<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="clock-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#161a26" flood-opacity="0.35"/>
    </filter>
    <!-- The plate itself, so nothing of the mark spills over its rounded edge -->
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#4C536D" filter="url(#tile-shadow)"/>

  <g clip-path="url(#tile)">
    <!-- The ring of the company mark -->
    <circle cx="512" cy="466" r="262" fill="none" stroke="#F1F1F1" stroke-width="15" opacity="0.92"/>

    <!-- A clock in place of the eagle -->
    <g filter="url(#clock-shadow)">
      <circle cx="512" cy="455" r="170" fill="#F1F1F1"/>
    </g>
    <g stroke="#4C536D" stroke-width="13" stroke-linecap="round">
      <line x1="512" y1="317" x2="512" y2="343"/>
      <line x1="650" y1="455" x2="624" y2="455"/>
      <line x1="512" y1="593" x2="512" y2="567"/>
      <line x1="374" y1="455" x2="400" y2="455"/>
    </g>
    <g stroke="#4C536D" stroke-linecap="round">
      <line x1="512" y1="455" x2="512" y2="364" stroke-width="22"/>
      <line x1="512" y1="455" x2="587" y2="493" stroke-width="18"/>
    </g>
    <circle cx="512" cy="455" r="16" fill="#4C536D"/>

    <!-- City skyline on its baseline, as in the company mark -->
    <g fill="#F1F1F1">
      <rect x="276" y="742" width="80" height="78" rx="6"/>
      <rect x="364" y="700" width="92" height="120" rx="6"/>
      <rect x="464" y="736" width="72" height="84" rx="6"/>
      <rect x="544" y="688" width="98" height="132" rx="6"/>
      <rect x="650" y="726" width="76" height="94" rx="6"/>
      <rect x="734" y="754" width="70" height="66" rx="6"/>
      <rect x="258" y="828" width="508" height="18" rx="9"/>
    </g>
    <g fill="#4C536D">
      <rect x="296" y="762" width="15" height="22" rx="4"/><rect x="321" y="762" width="15" height="22" rx="4"/>
      <rect x="296" y="796" width="15" height="22" rx="4"/><rect x="321" y="796" width="15" height="22" rx="4"/>
      <rect x="382" y="722" width="15" height="22" rx="4"/><rect x="407" y="722" width="15" height="22" rx="4"/>
      <rect x="382" y="758" width="15" height="22" rx="4"/><rect x="407" y="758" width="15" height="22" rx="4"/>
      <rect x="382" y="794" width="15" height="22" rx="4"/><rect x="407" y="794" width="15" height="22" rx="4"/>
      <rect x="482" y="758" width="15" height="22" rx="4"/><rect x="505" y="758" width="15" height="22" rx="4"/>
      <rect x="482" y="794" width="15" height="22" rx="4"/><rect x="505" y="794" width="15" height="22" rx="4"/>
      <rect x="562" y="710" width="15" height="22" rx="4"/><rect x="587" y="710" width="15" height="22" rx="4"/>
      <rect x="612" y="710" width="15" height="22" rx="4"/>
      <rect x="562" y="746" width="15" height="22" rx="4"/><rect x="587" y="746" width="15" height="22" rx="4"/>
      <rect x="612" y="746" width="15" height="22" rx="4"/>
      <rect x="562" y="782" width="15" height="22" rx="4"/><rect x="587" y="782" width="15" height="22" rx="4"/>
      <rect x="612" y="782" width="15" height="22" rx="4"/>
      <rect x="668" y="748" width="15" height="22" rx="4"/><rect x="693" y="748" width="15" height="22" rx="4"/>
      <rect x="668" y="784" width="15" height="22" rx="4"/><rect x="693" y="784" width="15" height="22" rx="4"/>
      <rect x="752" y="776" width="15" height="22" rx="4"/><rect x="777" y="776" width="15" height="22" rx="4"/>
    </g>
  </g>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-light)"/>
</svg>
